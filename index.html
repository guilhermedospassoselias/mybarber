<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InBarber - Agendamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0a0a0c; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .bg-card { background-color: #121215; border: 1px solid #222228; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-16 flex flex-col justify-between">
  <div>
    <!-- Topo da Marca -->
    <header class="border-b border-gray-800 bg-black/50 backdrop-blur sticky top-0 z-50">
      <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2 cursor-pointer" onclick="switchMode('client')">
          <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center font-bold text-black text-sm">IB</div>
          <span class="font-bold tracking-wide text-sm text-white">INBARBER</span>
        </div>
        <div id="gestor-badge" class="hidden flex items-center gap-2">
          <span class="text-xs bg-white/10 text-white border border-white/20 px-2.5 py-1 rounded-full font-bold uppercase tracking-wider">Painel Gestor</span>
          <button onclick="logoutGestor()" class="text-xs text-gray-400 hover:text-white transition-all"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
        </div>
      </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-6">
      <!-- MODO CLIENTE -->
      <div id="view-client" class="space-y-6">
        <div>
          <h2 class="text-xl font-bold text-white">Agende seu horário</h2>
          <p class="text-xs text-gray-400">Escolha o dia, serviços e horário</p>
        </div>

        <!-- 1. Profissional -->
        <div class="space-y-2">
          <label class="text-xs font-semibold uppercase tracking-wider text-white">1. Profissional</label>
          <div class="p-3 rounded-xl bg-card border border-white bg-white/10 flex items-center gap-3">
            <img src="https://images.unsplash.com/photo-1622286342621-4bd786c2447c?w=150" class="w-12 h-12 rounded-full object-cover">
            <div>
              <p class="text-sm font-bold text-white">Barbeiro Principal</p>
              <p class="text-xs text-gray-400">Master Barber</p>
            </div>
          </div>
        </div>

        <!-- 2. Serviços -->
        <div class="space-y-2">
          <label class="text-xs font-semibold uppercase tracking-wider text-white">2. Serviços</label>
          <div class="space-y-2 max-h-56 overflow-y-auto pr-1" id="services-list">
            <!-- Injetado dinamicamente -->
          </div>
        </div>

        <!-- 3. Dias do Mês (01 ao 31) -->
        <div class="space-y-2">
          <label class="text-xs font-semibold uppercase tracking-wider text-white">3. Dia do Agendamento (01 a 31)</label>
          <div class="grid grid-cols-5 gap-2 max-h-48 overflow-y-auto pr-1" id="days-grid">
            <!-- Injetado dinamicamente -->
          </div>
        </div>

        <!-- 4. Horários (09h às 22h) -->
        <div class="space-y-2">
          <label class="text-xs font-semibold uppercase tracking-wider text-white">4. Horário Disponível (09h às 22h)</label>
          <div class="grid grid-cols-4 gap-2 max-h-52 overflow-y-auto pr-1" id="slots-container">
            <!-- Injetado dinamicamente -->
          </div>
        </div>

        <!-- Formulário -->
        <div class="space-y-3 pt-2">
          <input type="text" id="cust-name" placeholder="Seu Nome Completo" class="w-full bg-card border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-white outline-none">
          <input type="tel" id="cust-phone" placeholder="WhatsApp (DDD + Número)" class="w-full bg-card border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-white outline-none">
          <button onclick="confirmBooking()" class="w-full py-4 rounded-xl bg-white text-black font-bold text-sm uppercase tracking-wider shadow-lg hover:bg-gray-200 transition-all">Confirmar Agendamento</button>
        </div>
      </div>

      <!-- MODO GESTOR -->
      <div id="view-gestor" class="hidden space-y-6">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-xl font-bold text-white">Agenda do Barbeiro</h2>
            <p class="text-xs text-gray-400">Gerencie horários e atendimentos</p>
          </div>
          <button onclick="openBlockModal()" class="px-3 py-2 bg-white/10 text-white rounded-lg border border-white/20 text-xs font-semibold hover:bg-white/20 transition-all flex items-center gap-1">
            <i class="fa-solid fa-ban"></i> Bloquear
          </button>
        </div>

        <div class="bg-card p-3 rounded-xl border border-gray-800 flex items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-calendar text-gray-400 text-xs"></i>
            <span class="text-xs text-gray-400 font-semibold uppercase">Data:</span>
          </div>
          <input type="date" id="gestor-date-input" onchange="changeGestorDate(this.value)" class="bg-black text-white text-xs border border-gray-800 rounded-lg px-3 py-2 focus:border-white outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="bg-card p-3 rounded-xl border border-gray-800 text-center">
            <p class="text-[10px] uppercase text-gray-400 font-bold">Agendamentos</p>
            <p class="text-lg font-bold text-white" id="stat-count">0</p>
          </div>
          <div class="bg-card p-3 rounded-xl border border-gray-800 text-center">
            <p class="text-[10px] uppercase text-gray-400 font-bold">Faturamento Estimado</p>
            <p class="text-lg font-bold text-white" id="stat-total">R$ 0,00</p>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs font-semibold uppercase tracking-wider text-white">Atendimentos do Dia</label>
          <div id="gestor-list" class="space-y-3">Carregando agendamentos...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Rodapé -->
  <footer class="max-w-md mx-auto w-full px-4 py-4 text-center border-t border-gray-900 mt-8">
    <button id="footer-btn" onclick="requestGestorAccess()" class="text-xs text-gray-500 hover:text-gray-300 transition-all flex items-center justify-center gap-1.5 mx-auto">
      <i class="fa-solid fa-lock text-[10px]"></i> Área do Barbeiro
    </button>
  </footer>

  <script>
    const SUPABASE_URL = "https://totwzrffyoiwlqzqxnjk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WTWvqYi4K8L4Iv7Vp0mh-w_mMWMAfqo";
    const GESTOR_PIN = "1234";
    
    let _supabase = null;
    try {
      if (typeof supabase !== 'undefined' && supabase.createClient) {
        _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {
      console.warn("Modo offline ativado.");
    }

    let selectedServices = [];
    let selectedDate = new Date().toISOString().split('T')[0];
    let selectedTime = null;
    let gestorFilterDate = new Date().toISOString().split('T')[0];

    const servicosCatalog = [
      { id: 'corte_social', nome: 'Corte social', preco: 40, tempo: 20 },
      { id: 'corte_degrade_maquina', nome: 'Corte degrade máquina', preco: 40, tempo: 20 },
      { id: 'corte_degrade_navalhado', nome: 'Corte degrade navalhado', preco: 45, tempo: 25 },
      { id: 'corte_degrade_shaver', nome: 'Corte degrade shaver', preco: 45, tempo: 30 },
      { id: 'barba_normal', nome: 'Barba normal', preco: 30, tempo: 20 },
      { id: 'barba_toalha_quente', nome: 'Barba toalha quente', preco: 35, tempo: 25 },
      { id: 'sobrancelha', nome: 'Sobrancelha', preco: 20, tempo: 5 },
      { id: 'bigode', nome: 'Bigode', preco: 20, tempo: 5 },
      { id: 'cavanhaque', nome: 'Cavanhaque', preco: 20, tempo: 5 },
      { id: 'pigmentacao_cabelo', nome: 'Pigmentação cabelo', preco: 35, tempo: 40 },
      { id: 'pigmentacao_barba', nome: 'Pigmentação barba', preco: 25, tempo: 40 },
      { id: 'pigmentacao_sobrancelha', nome: 'Pigmentação sobrancelha', preco: 20, tempo: 10 },
      { id: 'luzes', nome: 'Luzes', preco: 150, tempo: 120 },
      { id: 'platinado', nome: 'Platinado', preco: 200, tempo: 150 }
    ];

    const allSlots = [
      "09:00", "09:45", "10:45", "11:45", 
      "13:00", "13:45", "14:45", "15:45", 
      "16:45", "17:45", "18:45", "19:45", 
      "20:45", "21:30", "22:00"
    ];

    function initClientUI() {
      const sContainer = document.getElementById('services-list');
      if (sContainer) {
        sContainer.innerHTML = servicosCatalog.map(s => `
          <div onclick="toggleService('${s.id}')" id="srv-${s.id}" class="p-3 rounded-xl bg-card border border-gray-800 cursor-pointer flex justify-between items-center transition-all">
            <div>
              <p class="text-sm font-semibold text-white">${s.nome}</p>
              <p class="text-xs text-gray-400">${s.tempo} min • R$ ${s.preco},00</p>
            </div>
            <i class="fa-solid fa-circle text-gray-700 id-icon"></i>
          </div>
        `).join('');
      }

      const dContainer = document.getElementById('days-grid');
      if (dContainer) {
        const days = getFullMonthDays();
        dContainer.innerHTML = days.map(d => `
          <div onclick="selectDate('${d.dateIso}')" id="day-${d.dateIso}" class="p-2 rounded-xl bg-card border ${selectedDate === d.dateIso ? 'border-white bg-white text-black' : 'border-gray-800 text-gray-300'} text-center cursor-pointer transition-all">
            <p class="text-[9px] font-bold uppercase ${selectedDate === d.dateIso ? 'text-black' : 'text-gray-400'}">${d.labelDay}</p>
            <p class="text-xs font-bold mt-0.5">${d.labelNum}</p>
          </div>
        `).join('');
      }

      loadAvailableSlots();
    }

    function getFullMonthDays() {
      const days = [];
      const daysOfWeek = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(year, month, day);
        const dayFormatted = day < 10 ? '0' + day : day;
        const monthFormatted = (month + 1) < 10 ? '0' + (month + 1) : (month + 1);
        const isoDate = `${year}-${monthFormatted}-${dayFormatted}`;
        days.push({ dateIso: isoDate, labelDay: daysOfWeek[d.getDay()], labelNum: `${dayFormatted}/${monthFormatted}` });
      }
      return days;
    }

    function toggleService(id) {
      if (selectedServices.includes(id)) {
        selectedServices = selectedServices.filter(x => x !== id);
      } else {
        selectedServices.push(id);
      }

      servicosCatalog.forEach(s => {
        const el = document.getElementById(`srv-${s.id}`);
        if (!el) return;
        const icon = el.querySelector('.id-icon');
        if (selectedServices.includes(s.id)) {
          el.className = "p-3 rounded-xl bg-card border border-white bg-white/10 cursor-pointer flex justify-between items-center transition-all";
          if (icon) icon.className = "fa-solid fa-circle-check text-white id-icon";
        } else {
          el.className = "p-3 rounded-xl bg-card border border-gray-800 cursor-pointer flex justify-between items-center transition-all";
          if (icon) icon.className = "fa-solid fa-circle text-gray-700 id-icon";
        }
      });
    }

    function selectDate(dateIso) {
      selectedDate = dateIso;
      selectedTime = null;

      const days = getFullMonthDays();
      days.forEach(d => {
        const el = document.getElementById(`day-${d.dateIso}`);
        if (!el) return;
        if (d.dateIso === dateIso) {
          el.className = "p-2 rounded-xl bg-card border border-white bg-white text-black text-center cursor-pointer transition-all";
        } else {
          el.className = "p-2 rounded-xl bg-card border border-gray-800 text-gray-300 text-center cursor-pointer transition-all";
        }
      });

      loadAvailableSlots();
    }

    async function loadAvailableSlots() {
      let occupied = [];
      if (_supabase) {
        try {
          const { data } = await _supabase.from('agendamentos').select('horario').eq('data', selectedDate).neq('status', 'cancelado');
          if (data) occupied = data.map(a => a.horario);
        } catch(e){}
      }

      const free = allSlots.filter(s => !occupied.includes(s));
      const container = document.getElementById('slots-container');
      if (!container) return;

      if (free.length === 0) {
        container.innerHTML = `<p class="col-span-4 text-xs text-gray-500 py-2">Nenhum horário disponível nesta data.</p>`;
        return;
      }

      container.innerHTML = free.map(s => `
        <button onclick="selectTime('${s}')" class="slot-btn py-2 rounded-lg text-xs font-semibold bg-card border ${selectedTime === s ? 'border-white bg-white text-black' : 'border-gray-800 text-gray-300'}">${s}</button>
      `).join('');
    }

    function selectTime(s) {
      selectedTime = s;
      document.querySelectorAll('.slot-btn').forEach(btn => {
        if(btn.innerText.trim() === s) {
          btn.className = "slot-btn py-2 rounded-lg text-xs font-semibold bg-white text-black border border-white";
        } else {
          btn.className = "slot-btn py-2 rounded-lg text-xs font-semibold bg-card border border-gray-800 text-gray-300";
        }
      });
    }

    async function confirmBooking() {
      const name = document.getElementById('cust-name')?.value.trim();
      const phone = document.getElementById('cust-phone')?.value.trim();

      if (!name || !phone || !selectedTime || selectedServices.length === 0) {
        alert('Por favor, preencha nome, WhatsApp e selecione ao menos um serviço, dia e horário.');
        return;
      }

      const totalValue = selectedServices.reduce((acc, curr) => {
        const item = servicosCatalog.find(s => s.id === curr);
        return acc + (item ? item.preco : 0);
      }, 0);

      if (_supabase) {
        try {
          const { error } = await _supabase.from('agendamentos').insert([{
            cliente_nome: name, cliente_whatsapp: phone, barbeiro_id: 'barbeiro',
            servicos: selectedServices, data: selectedDate, horario: selectedTime,
            valor_total: totalValue, status: 'confirmado'
          }]);

          if (error) { alert('Erro: ' + error.message); return; }
        } catch(e){}
      }

      alert('Agendamento realizado com sucesso!');
      selectedServices = [];
      selectedTime = null;
      initClientUI();
    }

    function switchMode(mode) {
      const clientView = document.getElementById('view-client');
      const gestorView = document.getElementById('view-gestor');
      const badge = document.getElementById('gestor-badge');
      const footerBtn = document.getElementById('footer-btn');

      if (mode === 'gestor') {
        clientView.classList.add('hidden');
        gestorView.classList.remove('hidden');
        badge.classList.remove('hidden');
        footerBtn.classList.add('hidden');
        document.getElementById('gestor-date-input').value = gestorFilterDate;
        loadGestorData();
      } else {
        clientView.classList.remove('hidden');
        gestorView.classList.add('hidden');
        badge.classList.add('hidden');
        footerBtn.classList.remove('hidden');
      }
    }

    function requestGestorAccess() {
      const pin = prompt("Digite a senha do barbeiro:");
      if (pin === GESTOR_PIN) switchMode('gestor');
      else if (pin !== null) alert("Senha incorreta!");
    }

    function logoutGestor() { switchMode('client'); }

    function changeGestorDate(d) {
      gestorFilterDate = d;
      loadGestorData();
    }

    async function loadGestorData() {
      const container = document.getElementById('gestor-list');
      if (!container || !_supabase) return;

      try {
        const { data } = await _supabase.from('agendamentos').select('*').eq('data', gestorFilterDate).order('horario', { ascending: true });
        if (!data || data.length === 0) {
          container.innerHTML = `<p class="text-xs text-gray-500 text-center py-6">Nenhum agendamento para esta data.</p>`;
          document.getElementById('stat-count').innerText = "0";
          document.getElementById('stat-total').innerText = "R$ 0,00";
          return;
        }

        const validos = data.filter(a => a.status !== 'cancelado');
        document.getElementById('stat-count').innerText = validos.length;
        document.getElementById('stat-total').innerText = `R$ ${validos.reduce((a,c) => a + (c.valor_total || 0), 0)},00`;

        container.innerHTML = data.map(a => {
          const serviceNames = (a.servicos || []).map(sId => servicosCatalog.find(x => x.id === sId)?.nome || sId).join(', ');
          const cleanPhone = (a.cliente_whatsapp || '').replace(/\D/g, '');
          const msg = encodeURIComponent(`Olá ${a.cliente_nome}! Confirmando seu horário na InBarber hoje às ${a.horario}. Podemos confirmar?`);
          const isBlocked = a.cliente_nome === 'HORÁRIO BLOQUEADO';

          return `
            <div class="p-3 bg-card rounded-xl border border-gray-800 space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <p class="text-sm font-bold text-white">${a.horario} - ${a.cliente_nome}</p>
                  ${a.cliente_whatsapp && !isBlocked ? `<p class="text-xs text-gray-300"><i class="fa-solid fa-phone text-[10px] text-gray-500 mr-1"></i>${a.cliente_whatsapp}</p>` : ''}
                  <p class="text-xs text-gray-400 mt-0.5">${serviceNames}</p>
                  <p class="text-xs font-semibold text-white mt-1">R$ ${a.valor_total},00</p>
                </div>
                <span class="text-[10px] px-2 py-0.5 rounded bg-white/10 text-white font-bold uppercase">${a.status}</span>
              </div>
              
              ${!isBlocked && cleanPhone ? `
                <div class="pt-2 border-t border-gray-800/80 flex gap-2">
                  <a href="https://wa.me/55${cleanPhone}?text=${msg}" target="_blank" class="px-2.5 py-1 rounded-lg bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 text-xs font-semibold hover:bg-emerald-600/30 transition-all flex items-center gap-1">
                    <i class="fa-brands fa-whatsapp text-xs"></i> Chamar no WhatsApp
                  </a>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      } catch(e){}
    }

    async function openBlockModal() {
      const slot = prompt(`Digite o horário que deseja bloquear (Ex: 12:00, 13:00, 20:45) entre os disponíveis:\n\n${allSlots.join(', ')}`);
      if (!slot) return;
      if (!_supabase) return;

      try {
        const { error } = await _supabase.from('agendamentos').insert([{
          cliente_nome: 'HORÁRIO BLOQUEADO',
          cliente_whatsapp: '',
          barbeiro_id: 'barbeiro',
          servicos: [],
          data: gestorFilterDate,
          horario: slot,
          valor_total: 0,
          status: 'confirmado'
        }]);

        if (error) { alert('Erro ao bloquear: ' + error.message); return; }
        alert(`Horário ${slot} bloqueado com sucesso!`);
        loadGestorData();
      } catch(e){}
    }

    // Inicialização
    initClientUI();
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('modo') === 'gestor') switchMode('gestor');
  </script>
</body>
</html>
